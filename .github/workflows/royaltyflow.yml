name: RoyaltyFlow CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore, build and test
        run: |
          dotnet restore RoyaltyFlow.sln
          dotnet build RoyaltyFlow.sln -c Release --no-restore
          dotnet test RoyaltyFlow.sln -c Release --no-build --no-restore
          dotnet restore RoyaltyFlow.PostgresTests/RoyaltyFlow.PostgresTests.csproj
          dotnet build RoyaltyFlow.PostgresTests/RoyaltyFlow.PostgresTests.csproj -c Release --no-restore
          dotnet test RoyaltyFlow.PostgresTests/RoyaltyFlow.PostgresTests.csproj -c Release --no-build --no-restore
      - name: Validate deployment inputs and build the release image
        env:
          POSTGRES_PASSWORD: synthetic-compose-check
          ROYALTYFLOW_DEMO_PASSWORD: synthetic-read-only-check
          ROYALTYFLOW_WRITE_TOKEN: synthetic-compose-check-operator-token
        run: |
          bash -n scripts/deploy-release.sh
          python3 scripts/smoke_test.py --check-fixture
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config -q
          docker build --file RoyaltyFlow.Api/Dockerfile --tag "royaltyflow-api:$GITHUB_SHA" .
